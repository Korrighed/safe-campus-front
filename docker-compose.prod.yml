services:
    sc_front:
        build:
            context: .
            dockerfile: docker/Dockerfile.prod
            args:
                FRONT_PORT: '${FRONT_PORT:-3000}'
        image: safe-campus-front-sc_front-prod
        container_name: SC_Front_Prod
        restart: unless-stopped
        ports:
            - '${FRONT_PORT:-3000}:${FRONT_PORT:-3000}'
        environment:
            NODE_ENV: production
            PORT: '${FRONT_PORT:-3000}'
            # Back et front sont deux stacks separees, pas de reseau Docker partage comme
            # en dev (`scback`) : le back doit etre joignable publiquement. Le navigateur
            # (NUXT_PUBLIC_API_BASE) et le SSR (NUXT_API_BASE_INTERNAL) utilisent donc la
            # meme URL publique.
            # NUXT_API_BASE_INTERNAL doit etre fournie a l'EXECUTION : nuxt.config.ts calcule
            # sa valeur par defaut au build, avant que ces variables n'existent (sinon le SSR
            # interroge http://localhost:8000 et les pages de contenu repondent 404).
            NUXT_PUBLIC_API_BASE: '${NUXT_PUBLIC_API_BASE}'
            NUXT_API_BASE_INTERNAL: '${NUXT_API_BASE_INTERNAL:-${NUXT_PUBLIC_API_BASE}}'
        # Point de depart, pas mesure en charge reelle (a ajuster selon le trafic
        # observe en production). Nettement sous le dev (2G) : plus de serveur Vite/HMR
        # a alimenter, juste le serveur Nitro bundle.
        deploy:
            resources:
                limits:
                    cpus: '1'
                    memory: 512M
                reservations:
                    memory: 256M
